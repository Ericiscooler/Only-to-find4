<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Heart Animation</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        canvas {
            background: #000;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.1);
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        const SIZE = Math.min(window.innerWidth, window.innerHeight, 700);
        canvas.width = SIZE;
        canvas.height = SIZE;

        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;

        function getHeartPoint(t, scale = 12) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return {
                x: WIDTH / 2 + x * scale,
                y: HEIGHT / 2 - 30 + y * scale
            };
        }

        class HeartParticle {
            constructor(x, y, delay) {
                self = this;
                this.x = x;
                this.y = y;
                this.delay = delay;
                this.alpha = 0;
                this.flickerSpeed = 0.03 + Math.random() * 0.04;
                this.fontSize = Math.floor(10 + Math.random() * 6);
            }

            update(frame) {
                if (frame > this.delay && this.alpha < 1) {
                    this.alpha = Math.min(1, this.alpha + 0.03);
                }

                if (this.alpha >= 1) {
                    return 0.75 + 0.25 * Math.sin(frame * this.flickerSpeed);
                }
                return this.alpha;
            }

            draw(ctx, currentAlpha) {
                if (currentAlpha <= 0) return;

                ctx.save();
                ctx.font = `bold ${this.fontSize}px Consolas, monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Blue glow effect
                ctx.shadowColor = 'rgb(30, 160, 255)';
                ctx.shadowBlur = 8;
                ctx.fillStyle = `rgba(120, 225, 255, ${currentAlpha})`;

                ctx.fillText("Love You", this.x, this.y);
                ctx.restore();
            }
        }

        const particles = [];
        let count = 0;

        for (let scaleStep = 3; scaleStep <= 15; scaleStep++) {
            const pointsInLayer = Math.floor(scaleStep * 10);
            for (let i = 0; i < pointsInLayer; i++) {
                const t = (i / pointsInLayer) * 2 * Math.PI;
                const pt = getHeartPoint(t, scaleStep);
                pt.x += (Math.random() - 0.5) * 10;
                pt.y += (Math.random() - 0.5) * 10;
                particles.push(new HeartParticle(pt.x, pt.y, count * 0.5));
                count++;
            }
        }

        let frame = 0;

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            frame++;

            particles.forEach(p => {
                const alpha = p.update(frame);
                p.draw(ctx, alpha);
            });

            // Big central text reveal
            if (frame > 150) {
                const pulse = 1 + 0.04 * Math.sin(frame * 0.08);
                const cAlpha = Math.min(1, (frame - 150) * 0.02);

                ctx.save();
                ctx.translate(WIDTH / 2, HEIGHT / 2 - 10);
                ctx.scale(pulse, pulse);

                // Outer text glow
                ctx.shadowColor = 'rgb(0, 180, 255)';
                ctx.shadowBlur = 25;
                ctx.font = 'bold 42px Georgia, serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = `rgba(220, 250, 255, ${cAlpha})`;

                ctx.fillText("I Love You", 0, 0);
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            const newSize = Math.min(window.innerWidth, window.innerHeight, 700);
            canvas.width = newSize;
            canvas.height = newSize;
        });
    </script>
</body>
</html>
